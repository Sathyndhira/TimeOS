<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeOS</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #222;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
    </style>
    <script type="module" src="./script.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>

    <div id="welcome" class="window" style="width: 450px; padding: 15px;
    top: 50%; left: 50%; transform: translate(-50%, -50%); 
    color: white; position: relative;">

        <h3 id="welcomeheader"
            style="margin-bottom: 5px; text-align: center; background: rgba(255,255,255,0.1); margin: -15px -15px 10px -15px; padding: 10px; border-radius: 12px 12px 0 0; user-select: none;">
            TimeOS</h3>

        <p style="margin-top: 0; text-align: center;">Engineered from the ground up for maximum productivity<br>
            this OS eliminates distractions to keep you in your creative flow</p>
        <p class="closebutton" id="welcomeClose">
            &#128473;</p>
    </div>

    <div
        style="display: flex; justify-content: space-between; 
    background-color: rgba(0, 0, 0, 0.5); color: darkslategray; height: 30px; position: absolute; bottom: 0; width: 100%;">
        <p style="margin-left: 16px; font-size: small; margin-top: 5px;">TimeOS</p>
        <p id="timeElement" style="margin-right: 16px; font-size: small; margin-top: 5px;">time</p>
    </div>

    <script>
        function updateTime() {
            var time = new Date().toLocaleString();
            var timeAsText = document.querySelector("#timeElement");
            if (timeAsText) timeAsText.innerHTML = time;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>

    <script src="script.js"></script>
</body>

</html>
